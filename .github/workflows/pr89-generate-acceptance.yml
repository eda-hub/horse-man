name: PR89 合成受入とrelease生成確認
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PDF検査準備
        run: command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
      - name: 全回帰から受入原本を生成
        run: python3 scripts/run_cycle04_acceptance.py --write
      - name: v1.7.0原子manifestを生成
        run: python3 scripts/build_v170_manifest.py
      - name: 受入とmanifestの内容をログで照合
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          targets = [
              ("PR89_ACCEPT", "docs/validation/reviews/cycle_04/acceptance.json"),
              ("PR89_RELEASE", "docs/validation/contracts/v170-release.json"),
          ]
          for key, name in targets:
              value = json.loads(Path(name).read_text(encoding="utf-8"))
              output = json.dumps(value, ensure_ascii=True, separators=(",", ":"))
              print(key + "_BEGIN", flush=True)
              for pos in range(0, len(output), 600):
                  print(key + "_CHUNK:" + output[pos:pos+600], flush=True)
              print(key + "_END", flush=True)
          PY
