name: PR85 合成受入とrelease生成（一時検証）
on:
  push:
    branches:
      - fix/p1-cycle-completion
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PDF原票検証の依存導入
        run: command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
      - name: 合成受入を全件実行して生成
        run: python3 scripts/run_cycle04_acceptance.py --write
      - name: release manifestを実ファイルから再生成
        run: python3 scripts/build_v170_manifest.py
      - name: 生成物をログへ構造化出力
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name,path in [('ACCEPTANCE','docs/validation/reviews/cycle_04/acceptance.json'),('RELEASE','docs/validation/contracts/v170-release.json')]:
              val=json.loads(Path(path).read_text(encoding='utf-8'))
              src=json.dumps(val,ensure_ascii=False,separators=(',',':'))
              parts=[src[i:i+3500] for i in range(0,len(src),3500)]
              print(f'PR85_{name}_COUNT={len(parts)}')
              for i,chunk in enumerate(parts):
                  print(f'PR85_{name}_SEG_{i}={chunk}')
          PY
