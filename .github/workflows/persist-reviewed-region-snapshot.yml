name: 検証済み地域集計JSONの一回保存
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/persist-reviewed-region-snapshot.yml'
      - 'data/condition_stats/transfer/**'
jobs:
  persist:
    if: github.repository == 'eda-hub/horse-man' && github.event.pull_request.number == 69 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/next-cycle-prediction-contract'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 転送内容・JSON・固定hashを照合し唯一の対象ファイルを保存
        run: |
          python3 - <<'PY'
          import gzip,hashlib,json,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from pedigree_registry import digest
          archive=Path('data/condition_stats/transfer/c37467eef8f237e25f504cbd725c90158e1c65e468c66a7cf283fab393b86e9c.json.gz').read_bytes()
          assert hashlib.sha256(archive).hexdigest()=='748c36bdb6f54c69a49f5944229bd2cab4a246bf85184e8ada3d567818c1eeaf'
          raw=gzip.decompress(archive)
          assert len(raw)==30891655 and hashlib.sha256(raw).hexdigest()=='0a30291ed6eb59c6a39437e6f90ea1e6c091d36de02820b7e701baee0ccdf662'
          assert subprocess.check_output(['git','hash-object','--stdin'],input=raw).decode().strip()=='01e13ee18b45cba638d40b5d3e6f9a13c07553f3'
          record=json.loads(raw);expected='c37467eef8f237e25f504cbd725c90158e1c65e468c66a7cf283fab393b86e9c'
          assert record['content_sha256']==digest({k:v for k,v in record.items() if k!='content_sha256'})==expected
          assert record['mode']=='REPLAY' and record['production_eligible'] is False and record['completeness']=='COMPLETE'
          target=Path('data/condition_stats/snapshots/prediction-period-jra-training-regions-20261010/c37467eef8f237e25f504cbd725c90158e1c65e468c66a7cf283fab393b86e9c.json')
          if target.exists():
              assert target.read_bytes()==raw
          else:
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(raw)
          assert target.read_bytes()==raw
          print(json.dumps({'verified_blob':'01e13ee18b45cba638d40b5d3e6f9a13c07553f3','bytes':len(raw)}))
          PY
      - name: HEAD一致を確認して日本語コミットを通常push
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin feature/next-cycle-prediction-contract
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git add -f -- 'data/condition_stats/snapshots/prediction-period-jra-training-regions-20261010/c37467eef8f237e25f504cbd725c90158e1c65e468c66a7cf283fab393b86e9c.json'
          test "$(git diff --cached --name-only)" = 'data/condition_stats/snapshots/prediction-period-jra-training-regions-20261010/c37467eef8f237e25f504cbd725c90158e1c65e468c66a7cf283fab393b86e9c.json'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '検証済みJRA159レース25条件の地域集計JSONを固定hashで保存'
          git push origin HEAD:refs/heads/feature/next-cycle-prediction-contract
