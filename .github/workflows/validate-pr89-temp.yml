name: PR89 複数延長の再受入
on:
  push:
    branches:
      - fix/p2-official-post-time-history
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/p2-official-post-time-history
      - name: PDF原資料検査の依存準備
        run: command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
      - name: 全回帰・合成受入を生成
        run: python3 scripts/run_cycle04_acceptance.py --write
      - name: release入力hashを実生成
        run: python3 scripts/build_v170_manifest.py
      - name: 第4台帳を検証
        run: python3 scripts/check_cycle04.py
      - name: 正式リリース整合を検証
        run: python3 scripts/run_release_readiness.py
      - name: 全入口統合受入を検証
        run: python3 scripts/check_integration_acceptance.py --full
      - name: 生成原本を作業ブランチへ保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/reviews/cycle_04/acceptance.json docs/validation/contracts/v170-release.json
          if git diff --cached --quiet; then
            echo '生成原本は既存と一致'
            exit 0
          fi
          git commit -m '複数延長の合成受入とrelease原本を再生成'
          git push origin HEAD:fix/p2-official-post-time-history
