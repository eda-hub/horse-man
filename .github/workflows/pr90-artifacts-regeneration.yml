name: PR90標準生成物の一時再生成
on:
  push:
    branches:
      - fix/p2-historical-eligibility
    paths:
      - .github/workflows/pr90-artifacts-regeneration.yml
  workflow_dispatch:
jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PDF原資料検査の依存準備
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: 第4サイクル標準受入の再生成
        run: python3 scripts/run_cycle04_acceptance.py --write
      - name: リリースmanifestの標準再生成
        run: python3 scripts/build_v170_manifest.py
      - name: 標準生成物の内容を固定出力
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for key, path in (
              ("ACCEPTANCE", "docs/validation/reviews/cycle_04/acceptance.json"),
              ("RELEASE", "docs/validation/contracts/v170-release.json"),
          ):
              print("PR90_ARTIFACT_" + key + "=" + json.dumps(Path(path).read_text(encoding="utf-8"), ensure_ascii=False))
          PY
      - name: 生成物の通常チェック
        run: |
          python3 scripts/check_cycle04.py
          python3 scripts/run_release_readiness.py
