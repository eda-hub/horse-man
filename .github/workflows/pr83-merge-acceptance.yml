name: PR83 最新main統合後の受入再生成（作業用）
on:
  push:
    branches:
      - fix/p1-shadow-evidence-integrity
permissions:
  contents: write
jobs:
  full-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: 全Git履歴を取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 原資料PDF検査の依存準備
        run: command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
      - name: 全回帰を通して合成受入PASSを再生成
        run: python3 scripts/run_cycle04_acceptance.py --write
      - name: 最新入力のrelease manifestを標準再生成
        run: python3 scripts/build_v170_manifest.py
      - name: 通常監査・第4契約・release・実main統合受入
        run: |
          python3 scripts/check_prediction_compliance.py --audit
          python3 scripts/check_cycle04.py
          python3 scripts/run_release_readiness.py
          python3 scripts/check_integration_acceptance.py --full
      - name: 成功した受入とmanifestのみ保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/reviews/cycle_04/acceptance.json docs/validation/contracts/v170-release.json
          if git diff --cached --quiet; then
            echo '再生成物は一致'
          else
            git commit -m 'PR82統合後の第4合成受入とrelease証跡を標準再生成'
            git push origin HEAD:refs/heads/fix/p1-shadow-evidence-integrity
          fi
