name: PR90の受入・リリース生成資料（臨時）
on:
  push:
    branches:
      - fix/p2-historical-eligibility
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PDF原資料検査の依存準備
        run: command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
      - name: 標準受入の実施とrelease生成・照合
        run: |
          python3 scripts/run_cycle04_acceptance.py --write
          python3 scripts/build_v170_manifest.py
          python3 scripts/check_cycle04.py
          python3 scripts/run_release_readiness.py
          python3 scripts/check_integration_acceptance.py --full
      - name: 正式生成物の伝達
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          for path in ("docs/validation/reviews/cycle_04/acceptance.json", "docs/validation/contracts/v170-release.json"):
              print("PR90_GENERATED_BEGIN " + path)
              print(base64.b64encode(gzip.compress(Path(path).read_bytes())).decode())
              print("PR90_GENERATED_END " + path)
          PY
