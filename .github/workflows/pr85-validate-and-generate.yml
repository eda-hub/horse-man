name: PR85 合成受入とrelease固定（作業用）
on:
  push:
    branches:
      - fix/p1-cycle-completion
permissions:
  contents: write
jobs:
  verify-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 対象ブランチと必要履歴を取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PDF資料検査の前提を整備
        run: command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
      - name: 全Python回帰を実行
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: 合成受入を生成
        run: python3 scripts/run_cycle04_acceptance.py --write
      - name: release manifestを再生成
        run: python3 scripts/build_v170_manifest.py
      - name: 通常のrelease整合・日別契約を検査
        run: |
          python3 scripts/run_release_readiness.py
          python3 scripts/check_cycle04.py
      - name: 合成受入とrelease manifestを日本語コミットで保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/reviews/cycle_04/acceptance.json docs/validation/contracts/v170-release.json
          if ! git diff --cached --quiet; then
            git commit -m "PR85統合後の合成受入とrelease manifestを再生成"
            git push origin HEAD:fix/p1-cycle-completion
          fi
          git status --short
