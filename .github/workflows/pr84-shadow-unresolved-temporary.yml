name: PR84未解決Shadow受入生成
on:
  push:
    branches:
      - fix/p1-final-shadow-state
    paths:
      - .github/workflows/pr84-shadow-unresolved-temporary.yml
permissions:
  contents: write
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 完全履歴を取得
        uses: actions/checkout@v4
        with:
          ref: fix/p1-final-shadow-state
          fetch-depth: 0
      - name: PDF検査依存を準備
        run: command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
      - name: 全回帰と合成受入の正式生成
        run: python3 scripts/run_cycle04_acceptance.py --write
      - name: release manifestの正式再生成
        run: python3 scripts/build_v170_manifest.py
      - name: 第4台帳の通常監査
        run: python3 scripts/check_cycle04.py
      - name: releaseの原子的整合
        run: python3 scripts/run_release_readiness.py --root .
      - name: 取得済みmainとの全入口統合受入
        run: python3 scripts/check_integration_acceptance.py --full
      - name: 成功した標準生成物のみ保存
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/reviews/cycle_04/acceptance.json docs/validation/contracts/v170-release.json
          git diff --cached --quiet && { echo '生成結果に変更なし'; exit 0; }
          git commit -m 'PR84未解決Shadow引継ぎ修正の合成受入とrelease原本を更新'
          git push origin HEAD:refs/heads/fix/p1-final-shadow-state
