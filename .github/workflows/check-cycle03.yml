name: 予想実行と第3サイクル台帳の機械監査
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'prediction/**'
jobs:
  cycle-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 回帰テスト
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: 予想記録の不足と実行ゲートの監査
        run: |
          set -o pipefail
          python3 scripts/check_prediction_compliance.py --audit | tee /tmp/cycle03-audit.txt
          {
            echo '### 予想記録の監査'
            echo '~~~text'
            cat /tmp/cycle03-audit.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 予想保存の事前宣言とreceiptを監査
        run: |
          set -o pipefail
          python3 scripts/verify_prediction_persistence.py --audit | tee /tmp/persistence-audit.txt
          {
            echo '### 予想保存の事前宣言とreceipt'
            echo '~~~text'
            cat /tmp/persistence-audit.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 日別記録と集計の照合（登録データ必須）
        run: python3 scripts/check_cycle03.py --require-data --require-complete
      - name: 第3サイクル終了資料の入力hash・集合・精算を照合
        run: python3 scripts/build_cycle03_review.py --check --require-complete
