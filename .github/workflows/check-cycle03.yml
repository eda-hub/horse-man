name: 予想実行と検証台帳の機械監査
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'prediction/**'
jobs:
  cycle-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 血統移行元commitの実ファイルと監査照合するため全履歴を取得
      - name: 回帰テスト
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: 血統調査リストの検証
        run: python3 scripts/pedigree_registry.py audit
      - name: 血統実データ照合の原票・個体・祖先位置・時点を検証
        run: python3 scripts/check_pedigree_reconciliation.py
      - name: 期間内全出走結果・追加血統・調教履歴と取得停止を検証
        run: python3 scripts/check_pedigree_followup.py
      - name: 血統候補の未確認棚卸しと条件集計snapshot監査
        run: |
          set -o pipefail
          python3 scripts/pedigree_stats.py --inventory > /tmp/pedigree-stat-inventory.json
          python3 scripts/pedigree_stats.py --audit | tee /tmp/pedigree-stat-audit.txt
          {
            echo '### 血統集計の準備・未確認候補'
            echo '~~~text'
            python3 - <<'PY'
          import json
          d = json.load(open('/tmp/pedigree-stat-inventory.json'))
          print('legacy_claims=', d['candidate_claims'], 'verified_facts=', d['verified_facts'],
                'source_verification_complete=', d['source_verification_complete'])
          PY
            cat /tmp/pedigree-stat-audit.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 予想記録の不足と実行ゲートの監査
        run: |
          set -o pipefail
          python3 scripts/check_prediction_compliance.py --audit | tee /tmp/cycle03-audit.txt
          {
            echo '### 予想記録の監査'
            echo '~~~text'
            cat /tmp/cycle03-audit.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 次期推奨買い目の保存・認証を独立監査
        run: |
          set -o pipefail
          python3 scripts/recommendation.py --audit | tee /tmp/recommendation-audit.txt
          {
            echo '### 次期推奨買い目の監査'
            echo '~~~text'
            cat /tmp/recommendation-audit.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 予想保存の事前宣言とreceiptを監査
        run: |
          set -o pipefail
          python3 scripts/verify_prediction_persistence.py --audit | tee /tmp/persistence-audit.txt
          {
            echo '### 予想保存の事前宣言とreceipt'
            echo '~~~text'
            cat /tmp/persistence-audit.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 現行manual releaseを判定
        id: manual
        shell: bash
        run: |
          release="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('docs/manual/README.md').read_text(encoding='utf-8')
          match = re.search(r'現行リリース[^\x60\n]*\x60([^\x60]+)\x60', text)
          if not match:
              raise SystemExit('manual release not found')
          print(match.group(1))
          PY
          )"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "manual_release=$release" >> "$GITHUB_STEP_SUMMARY"
      - name: 第3サイクル日別記録と集計の照合
        if: steps.manual.outputs.release == 'v1.6.1'
        run: python3 scripts/check_cycle03.py
      - name: 次期Prediction日別台帳の照合
        if: steps.manual.outputs.release == 'v1.7.0'
        run: python3 scripts/check_prediction_cycle.py
      - name: 未対応manual releaseを拒否
        if: steps.manual.outputs.release != 'v1.6.1' && steps.manual.outputs.release != 'v1.7.0'
        run: |
          echo "未対応manual release: ${{ steps.manual.outputs.release }}" >&2
          exit 1

