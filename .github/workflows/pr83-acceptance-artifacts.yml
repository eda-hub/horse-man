name: PR83 合成受入・release生成（作業用）
on:
  push:
    branches:
      - fix/p1-shadow-evidence-integrity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acceptance-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: 作業ブランチを完全取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PDF検査依存を準備
        run: command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
      - name: 全回帰・合成受入を標準生成
        run: python3 scripts/run_cycle04_acceptance.py --write
      - name: release manifestを標準生成
        run: python3 scripts/build_v170_manifest.py
      - name: 通常検査と統合受入
        run: |
          python3 scripts/check_prediction_compliance.py
          python3 scripts/check_prediction_compliance.py --audit
          python3 scripts/run_release_readiness.py
          python3 scripts/check_integration_acceptance.py --full
      - name: 合格した生成物だけ作業ブランチへ保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/reviews/cycle_04/acceptance.json docs/validation/contracts/v170-release.json
          if git diff --cached --quiet; then
            echo '生成物の内容に変更なし'
          else
            git commit -m 'PR83の全合成受入とrelease生成結果を保存'
            git push origin HEAD:refs/heads/fix/p1-shadow-evidence-integrity
          fi
