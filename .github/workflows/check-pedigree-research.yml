name: 血統研究の原票・Registry・条件集計監査
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  pedigree-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 研究原票・過去Git tree/blobの検査に全履歴が必要
      - name: PDF原資料検査の依存準備
        run: command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
      - name: 血統調査リストの検証
        run: python3 scripts/pedigree_registry.py audit
      - name: 血統実データ照合の原票・個体・祖先位置・時点を検証
        run: python3 scripts/check_pedigree_reconciliation.py
      - name: 期間内全出走結果・追加血統・調教履歴と取得停止を検証
        run: python3 scripts/check_pedigree_followup.py
      - name: JBIS取得不能分の別サイト血統原票・訂正・全件集計を検証
        run: python3 scripts/check_pedigree_alternative.py
      - name: 登録済み5頭の調教国原HTML追加証跡を検証
        run: python3 scripts/check_training_country_raw_evidence.py
      - name: 資料確認済み一覧6〜10番目の原文と既存登録を照合
        run: python3 scripts/check_training_country_r02.py
      - name: 資料確認済み一覧11〜30番目の原文・追加登録・時点を照合
        run: |
          python3 scripts/check_training_country_reviewed_batches.py
      - name: 指定祖先28表記の同定・役割・親子経路・調査キューを検証
        run: python3 scripts/check_designated_ancestor_scope.py
      - name: 父・母父613頭の開始時点・優先調査10頭・所属原資料を照合
        run: python3 scripts/check_training_country_priority.py --repo .
      - name: 海外先頭5登録行の個体・原票・5代・履歴を検証
        run: python3 scripts/check_foreign_pedigree_review.py
      - name: 追加指定祖先の本人所属原票・追記・時点を検証
        run: python3 scripts/check_training_country_ancestors.py
      - name: 旧記述分類・原コミット本文・歴史的保存不足の証跡を照合
        run: python3 scripts/check_remaining_reviews.py
      - name: R07のPR参照・中間commit・Git treeと保存証跡を再照合
        run: python3 scripts/check_historical_pr_refs.py
      - name: R06追加の本人原HTML・父直系・5代内包・原文成分を再照合
        run: python3 scripts/check_legacy_fact_followup.py
      - name: R08の公式成績・調教国・条件別集計と固定時点を再照合
        run: python3 scripts/check_r08_acceptance.py
      - name: 11日追加血統の固定対象・原票・62位置・追記時点を照合
        run: python3 scripts/check_oct11_pedigree_delta.py
      - name: 血統候補の未確認棚卸しと条件集計snapshot監査
        run: |
          set -o pipefail
          python3 scripts/pedigree_stats.py --inventory > /tmp/pedigree-stat-inventory.json
          python3 scripts/pedigree_stats.py --audit | tee /tmp/pedigree-stat-audit.txt
          {
            echo '### 血統集計の準備・未確認候補'
            echo '~~~text'
            python3 - <<'PY'
          import json
          d = json.load(open('/tmp/pedigree-stat-inventory.json'))
          print('legacy_claims=', d['candidate_claims'], 'verified_facts=', d['verified_facts'],
                'source_verification_complete=', d['source_verification_complete'])
          PY
            cat /tmp/pedigree-stat-audit.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
