name: 取得済みmainと候補契約の開始整合確認
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  integration-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # origin/mainの実commitと原票履歴を取得
      - name: 実mainとbranchの開始確認（全回帰は第4監査で1回実行）
        run: python3 scripts/check_integration_acceptance.py
