name: 17番再開用の作業データ取得
on:
  push:
    branches: [feature/next-cycle-prediction-contract]
    paths: [.github/workflows/task17-workspace-transfer.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 固定作業データをアーカイブ
        run: tar --exclude=.git -czf /tmp/horse-man-task17.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: horse-man-task17-workspace
          path: /tmp/horse-man-task17.tar.gz
          retention-days: 1
