name: PR84校正修正の標準受入生成
on:
  push:
    branches:
      - fix/p1-final-shadow-state
    paths:
      - .github/workflows/pr84-phase-calibration-acceptance-temporary.yml
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 全履歴を取得
        uses: actions/checkout@v4
        with:
          ref: fix/p1-final-shadow-state
          fetch-depth: 0
      - name: PDF検査依存を準備
        run: command -v pdftotext >/dev/null || { sudo apt-get update && sudo apt-get install -y poppler-utils; }
      - name: 合成受入を標準手順で実行
        run: python3 scripts/run_cycle04_acceptance.py --write
      - name: release manifestを標準手順で再生成
        run: python3 scripts/build_v170_manifest.py
      - name: 日別契約の機械検査
        run: python3 scripts/check_cycle04.py
      - name: release原子的整合
        run: python3 scripts/run_release_readiness.py --root .
      - name: 取得済みmainとの統合受入
        run: python3 scripts/check_integration_acceptance.py --full
      - name: 受入原本のみ保存
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/reviews/cycle_04/acceptance.json docs/validation/contracts/v170-release.json
          git diff --cached --quiet && { echo '標準生成物に差分なし'; exit 0; }
          git commit -m '校正phase修正後の合成受入とreleaseハッシュを正式生成'
          git push origin HEAD:refs/heads/fix/p1-final-shadow-state
