# Codex CLI security-oriented configuration.
# This file contains no credentials. Authentication data is stored in the
# dedicated Docker volume mounted at /home/node/.codex.

forced_login_method = "chatgpt"
cli_auth_credentials_store = "file"

# Keep interactive approval for operations that need escalation.
approval_policy = "on-request"

# Codex may edit the mounted repository, but not arbitrary host paths.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Commands launched by Codex do not get outbound network access by default.
# The Codex client itself can still reach OpenAI for normal operation.
network_access = false

[shell_environment_policy]
# Apply Codex's automatic exclusions for environment variables whose names
# contain KEY, SECRET, or TOKEN, reducing accidental secret exposure to tools.
ignore_default_excludes = false

[projects."/workspace"]
trust_level = "trusted"